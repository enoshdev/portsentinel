version: '3.8'

services:
  portsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: portsentinel:latest
    container_name: portsentinel-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=True
      - FIREWALL_DRY_RUN=True
      - AUTO_BLOCK_ENABLED=False
      - AUTO_BLOCK_THRESHOLD=80
    volumes:
      - portsentinel_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  portsentinel_data:
