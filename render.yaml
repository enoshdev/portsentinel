services:
  - type: web
    name: portsentinel
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: PYTHONPATH
        value: .
      - key: DEMO_MODE
        value: True
      - key: FIREWALL_DRY_RUN
        value: True
